services:
  # ── Python REST API Backend ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coe-forecaster-backend
    ports:
      - "8080:8080"
    volumes:
      # Persist generated data and audit trails across container restarts
      - forecaster-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - forecaster-net

  # ── Vite Dev Frontend (development mode) ─────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: coe-forecaster-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://backend:8080
    networks:
      - forecaster-net

volumes:
  forecaster-data:
    driver: local
  node_modules:
    driver: local

networks:
  forecaster-net:
    driver: bridge
